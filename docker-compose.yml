services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recetas_db}
      POSTGRES_USER: ${POSTGRES_USER:-recetas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recetas_user} -d ${POSTGRES_DB:-recetas_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-recetas_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-recetas_db}
    ports:
       - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
